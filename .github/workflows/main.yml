name: E2E on Chrome

on: [push]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
          record: false
          publish-summary: true
          component: false
        env:
          # Pass any environment variables from repository secrets
          CYPRESS_baseUrl: ${{ secrets.CYPRESS_BASE_URL }}
          CYPRESS_password: ${{ secrets.CYPRESS_PASSWORD }}
          # Add any other environment variables your tests need
          # Optional configurations:
          # build: npm run build
          # start: npm start
          # wait-on: http://localhost:3000
          # config-file: cypress.config.js
          # spec: "cypress/e2e/**/*.cy.{js,jsx,ts,tsx}"
        